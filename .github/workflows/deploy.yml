name: Build and Deploy to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - demo

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm test

  deploy-main:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_DB_ID: ${{ secrets.META_DB_ID }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$META_DB_ID" || { echo "Missing META_DB_ID"; exit 1; }
          test -n "$ADMIN_PASS" || { echo "Missing ADMIN_PASS"; exit 1; }
          test -n "$JWT_SECRET" || { echo "Missing JWT_SECRET"; exit 1; }

      - name: Create production config
        run: |
          cat > wrangler.toml <<'EOF'
          name = "iodrive"
          main = "src/index.ts"
          compatibility_date = "2026-09-07"
          compatibility_flags = ["nodejs_compat"]
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          routes = [{ pattern = "drive.iodevo.com/*", zone_name = "iodevo.com" }]
          [vars]
          ADMIN_USER = "admin"
          R2_PUBLIC_DOMAIN = "r2.iodevo.com"
          R2_BUCKET = "iodrive-apac"
          R2_ACCOUNT_ID = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TURNSTILE_SITE_KEY = "${{ secrets.TURNSTILE_SITE_KEY }}"
          S3_ENDPOINT = "${{ secrets.S3_ENDPOINT }}"
          S3_BUCKET = "${{ secrets.S3_BUCKET }}"
          S3_REGION = "${{ secrets.S3_REGION }}"
          PUBLIC_UPLOAD_PATH = "uploads/public/"
          [[r2_buckets]]
          binding = "DRIVE"
          bucket_name = "iodrive-apac"
          [observability.logs]
          enabled = true
          invocation_logs = true
          EOF

          # Append CACHE_KV namespace if secret is present
          if [ -n "${{ secrets.CACHE_KV_ID }}" ]; then
            cat >> wrangler.toml <<'EOF'

          [[kv_namespaces]]
          binding = "CACHE_KV"
          id = "${{ secrets.CACHE_KV_ID }}"
          EOF
          fi

          # D1 metadata is required by the application
          cat >> wrangler.toml <<'EOF'

          [[d1_databases]]
          binding = "META_DB"
          database_name = "iodrive-meta"
          database_id = "${{ secrets.META_DB_ID }}"
          EOF

          # Append RATE_LIMITER rate limit config
          cat >> wrangler.toml <<'EOF'

          [[ratelimits]]
          name = "RATE_LIMITER"
          namespace_id = "1001"
          [ratelimits.simple]
          limit = 100
          period = 60
          EOF

      - name: Upload secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.ADMIN_PASS }}" ]; then echo "${{ secrets.ADMIN_PASS }}" | npx wrangler secret put ADMIN_PASS; fi
          if [ -n "${{ secrets.TURNSTILE_SECRET }}" ]; then echo "${{ secrets.TURNSTILE_SECRET }}" | npx wrangler secret put TURNSTILE_SECRET; fi
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET; fi
          if [ -n "${{ secrets.R2_ACCESS_KEY }}" ]; then echo "${{ secrets.R2_ACCESS_KEY }}" | npx wrangler secret put R2_ACCESS_KEY; fi
          if [ -n "${{ secrets.R2_SECRET_KEY }}" ]; then echo "${{ secrets.R2_SECRET_KEY }}" | npx wrangler secret put R2_SECRET_KEY; fi
          if [ -n "${{ secrets.S3_ACCESS_KEY }}" ]; then echo "${{ secrets.S3_ACCESS_KEY }}" | npx wrangler secret put S3_ACCESS_KEY; fi
          if [ -n "${{ secrets.S3_SECRET_KEY }}" ]; then echo "${{ secrets.S3_SECRET_KEY }}" | npx wrangler secret put S3_SECRET_KEY; fi

      - name: Deploy to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Success
        run: echo "✅ https://drive.iodevo.com"

  deploy-demo:
    name: Deploy Demo
    runs-on: ubuntu-latest
    needs: deploy-main
    # Demo requires an isolated D1 database. Keep it opt-in so an unconfigured
    # optional environment cannot fail the production deployment pipeline.
    if: vars.DEPLOY_DEMO == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Validate demo database secret
        env:
          DEMO_META_DB_ID: ${{ secrets.DEMO_META_DB_ID }}
        run: test -n "$DEMO_META_DB_ID" || { echo "Missing DEMO_META_DB_ID"; exit 1; }

      - name: Create demo config
        run: |
          cat > wrangler.toml <<'EOF'
          name = "iodrive-demo"
          main = "src/index.ts"
          compatibility_date = "2026-09-07"
          compatibility_flags = ["nodejs_compat"]
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          routes = [{ pattern = "demo.iodevo.com/*", zone_name = "iodevo.com" }]
          [vars]
          ADMIN_USER = "admin"
          R2_PUBLIC_DOMAIN = "r2.iodevo.com"
          R2_BUCKET = "iodrive-demo"
          R2_ACCOUNT_ID = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TURNSTILE_SITE_KEY = "${{ secrets.TURNSTILE_SITE_KEY }}"
          S3_ENDPOINT = "${{ secrets.S3_ENDPOINT }}"
          S3_BUCKET = "${{ secrets.S3_BUCKET }}"
          S3_REGION = "${{ secrets.S3_REGION }}"
          PUBLIC_UPLOAD_PATH = "uploads/public/"
          [[r2_buckets]]
          binding = "DRIVE"
          bucket_name = "iodrive-demo"
          [observability.logs]
          enabled = true
          invocation_logs = true
          EOF

          # Append CACHE_KV namespace if secret is present
          if [ -n "${{ secrets.CACHE_KV_ID }}" ]; then
            cat >> wrangler.toml <<'EOF'

          [[kv_namespaces]]
          binding = "CACHE_KV"
          id = "${{ secrets.CACHE_KV_ID }}"
          EOF
          fi

          # Demo metadata is isolated from production
          cat >> wrangler.toml <<'EOF'

          [[d1_databases]]
          binding = "META_DB"
          database_name = "iodrive-demo-meta"
          database_id = "${{ secrets.DEMO_META_DB_ID }}"
          EOF

          # Append RATE_LIMITER rate limit config
          cat >> wrangler.toml <<'EOF'

          [[ratelimits]]
          name = "RATE_LIMITER"
          namespace_id = "1002"
          [ratelimits.simple]
          limit = 100
          period = 60
          EOF

      - name: Upload secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.ADMIN_PASS }}" | npx wrangler secret put ADMIN_PASS
          if [ -n "${{ secrets.TURNSTILE_SECRET }}" ]; then echo "${{ secrets.TURNSTILE_SECRET }}" | npx wrangler secret put TURNSTILE_SECRET; fi
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET; fi
          if [ -n "${{ secrets.R2_ACCESS_KEY }}" ]; then echo "${{ secrets.R2_ACCESS_KEY }}" | npx wrangler secret put R2_ACCESS_KEY; fi
          if [ -n "${{ secrets.R2_SECRET_KEY }}" ]; then echo "${{ secrets.R2_SECRET_KEY }}" | npx wrangler secret put R2_SECRET_KEY; fi
          if [ -n "${{ secrets.S3_ACCESS_KEY }}" ]; then echo "${{ secrets.S3_ACCESS_KEY }}" | npx wrangler secret put S3_ACCESS_KEY; fi
          if [ -n "${{ secrets.S3_SECRET_KEY }}" ]; then echo "${{ secrets.S3_SECRET_KEY }}" | npx wrangler secret put S3_SECRET_KEY; fi

      - name: Deploy to demo
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Success
        run: echo "✅ https://demo.iodevo.com"
